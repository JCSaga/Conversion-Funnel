<!DOCTYPE html>
<html>

<head>
  <title>Membership Funnel Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 40px 0;
      background: #fff;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    select,
    button {
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    button {
      background: #444;
      color: white;
    }

    button.pressed {
      transform: scale(0.96);
      opacity: 0.8;
      transition: 0.15s;
    }

    button {
      transition: 0.2s;
    }

    .grid {
      width: 1450px;
      display: grid;
      grid-template-columns: 720px 720px;
      gap: 10px;
    }

    .funnel-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }

    .country-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .row {
      display: flex;
      width: 100%;
      align-items: center;
      margin: 14px 0;
    }

    .stage {
      width: 300px;
      text-align: right;
      padding-right: 16px;
      font-size: 14px;
      white-space: nowrap;
      font-weight: bold;
      color: #333;
    }

    /* PROPER INVERTED FUNNEL TRAPEZOIDS */
    .bar-wrapper {
      height: 52px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .bar {
      height: 100%;
      color: white;
      font-weight: bold;
      font-size: 17px;
      line-height: 52px;
      text-align: center;
      width: var(--w);
      background: var(--c);
      clip-path: var(--shape);
      border-radius: 7px;
    }

    .metrics {
      width: 450px;
      text-align: left;
      padding-left: 10px;
      font-size: 12px;
      color: #333;
      line-height: 1.25;
    }
  </style>
</head>

<body>

  <h2 id="title"></h2>

  <div class="control-row">
    <select id="yearSelect"></select>
    <select id="monthSelect"></select>
    <button id="refreshBtn">Refresh Data</button>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    let jsonData = null;

    const START_YEAR = 2025;
    const CURRENT_YEAR = new Date().getFullYear();
    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    const COUNTRIES = [
      "United Kingdom + Other",
      "United Arab Emirates",
      "South Africa",
      "Jordan"
    ];

    fetchData();

    let selectorsBuilt = false;

    function fetchData() {
      fetch('/data')
        .then(res => res.json())
        .then(data => {
          jsonData = data;
          if (!selectorsBuilt) {
            buildSelectors();
            selectorsBuilt = true;
          }
          renderDashboard();
        });
    }

    function buildSelectors() {
      const yearSel = document.getElementById("yearSelect");
      const monthSel = document.getElementById("monthSelect");

      for (let y = START_YEAR; y <= CURRENT_YEAR; y++) {
        yearSel.innerHTML += `<option value="${y}">${y}</option>`;
      }
      for (let m = 0; m < 12; m++) {
        monthSel.innerHTML += `<option value="${String(m + 1).padStart(2, "0")}">${monthNames[m]}</option>`;
      }
      yearSel.onchange = renderDashboard;
      monthSel.onchange = renderDashboard;
    }

    function renderDashboard() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const year = document.getElementById("yearSelect").value;
      const month = document.getElementById("monthSelect").value;
      const key = `${year}-${month}`;

      document.getElementById("title").textContent =
        `Membership Funnel — ${monthNames[parseInt(month) - 1]} ${year}`;

      COUNTRIES.forEach(c => renderFunnelBox(grid, key, c));
    }

    function renderFunnelBox(grid, key, country) {
      const box = document.createElement("div");
      box.className = "funnel-box";

      const monthData = jsonData[key];
      const data = monthData ? monthData[country] : null;

      const order = [
        "Joined Waitlist",
        "Offer Interview",
        "Interview",
        "Offer Membership",
        "Paid",
        "Member"
      ];

      const rows = data
        ? order.map(n => Object.values(data.stages).find(s => s.name === n))
        : order.map(n => ({ name: n, count: 0, conversion_prev: 0, conversion_cohort: 0, drop: 0 }));

      const pct = x => (x * 100).toFixed(1) + "%";

      const widths = ["100%", "98%", "75%", "50%", "25%", "8%"];

      const shapes = [
        "inset(0 0 0 0)", // Rectangle (Joined Waitlist)

        "polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%)", // Offer Interview
        "polygon(0% 0%, 100% 0%, 85% 100%, 15% 100%)", // Interview
        "polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%)", // Offer Membership
        "polygon(0% 0%, 100% 0%, 70% 100%, 30% 100%)", // Paid
        "polygon(0% 0%, 100% 0%, 60% 100%, 40% 100%)"  // Member
      ];

      const colors = ["#4169E1", "#3A7FF0", "#5A8DEE", "#7FB5F3", "#F4C24B", "#DB5A2E"];

      box.innerHTML = `<div class="country-title">${country}</div>`;

      rows.forEach((r, i) => {
        // const prev = i === 0 ? "100% prev" : `prev ${pct(r.conversion_prev)}`;
        // const coh = `cohort ${pct(r.conversion_cohort)}`;
        const drop = i === 0 ? "" : `| drop ${r.drop}`;

        box.innerHTML += `
  <div class="row">
    <div class="stage">${r.name}</div>
    <div class="bar-wrapper">
      <div class="bar" style="--w:${widths[i]}; --c:${colors[i]}; --shape:${shapes[i]};">
        ${r.count}
      </div>
    </div>
    <div class="metrics">${i === 0 ? "" : `drop ${r.drop}`}</div>
  </div>`;

        // box.innerHTML += `
        // <div class="row">
        //   <div class="stage">${r.name}</div>
        //   <div class="bar-wrapper">
        //     <div class="bar" style="--w:${widths[i]}; --c:${colors[i]}; --shape:${shapes[i]};">
        //       ${r.count}
        //     </div>
        //   </div>
        //   <div class="metrics">${i === 0 ? coh : `${prev} | ${coh}${drop}`}</div>
        // </div>`;
      });

      grid.appendChild(box);
    }

    window.onload = () => {

      const refreshBtn = document.getElementById("refreshBtn");

      refreshBtn.addEventListener("click", () => {
        refreshBtn.disabled = true;
        refreshBtn.classList.add("pressed");
        const original = "Refresh Data";
        refreshBtn.textContent = "Refreshing...";

        fetch('/refresh', { method: 'POST' })
          .then(res => res.json())
          .then(json => {
            if (json.ok) {
              refreshBtn.textContent = "Refreshed ✓";
              fetchData();
            } else {
              refreshBtn.textContent = "Refresh Failed ✗";
              console.error(json.error || json);
            }

            setTimeout(() => {
              refreshBtn.disabled = false;
              refreshBtn.classList.remove("pressed");
              refreshBtn.textContent = original;
            }, 1500);
          })
          .catch(err => {
            refreshBtn.textContent = "Refresh Failed ✗";
            console.error(err);
            setTimeout(() => {
              refreshBtn.disabled = false;
              refreshBtn.classList.remove("pressed");
              refreshBtn.textContent = original;
            }, 1500);
          });
      });

    };


  </script>
</body>

</html>
