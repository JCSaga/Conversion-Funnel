<!DOCTYPE html>
<html>

<head>
  <title>Membership Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 30px 0 15px;
      font-size: 24px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    select,
    button {
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    button {
      background: #444;
      color: #fff;
    }

    .grid {
      width: 1450px;
      display: grid;
      grid-template-columns: 720px 720px;
      gap: 10px;
    }

    .funnel-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      background: #fafafa;
    }

    .country-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* ================= FUNNEL ================= */

    .row {
      display: flex;
      align-items: center;
      margin: 12px 0;
    }

    .stage {
      width: 120px;
      text-align: right;
      padding-right: 16px;
      font-weight: bold;
    }

    .bar-wrapper {
      flex: 1;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar {
      height: 100%;
      width: var(--w);
      background: var(--c);
      clip-path: var(--shape);
      border-radius: 7px;
      color: #fff;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .metrics {
      width: 120px;
      font-size: 14px;
      padding-left: 10px;
    }

    /* ================= CHURN ================= */

    .churn-legend {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      margin: -10px 0 20px;
      /* pulls it closer to dropdown */
      font-size: 13px;
      font-weight: bold;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .legend-onboarded {
      background: #4CAF50;
    }

    .legend-offboarded {
      background: #E74C3C;
    }

    .churn-scroll {
      max-height: 550px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .churn-chart {
      display: flex;
      align-items: flex-end;
      gap: 40px;
      min-width: max-content;
      height: 520px;
      /* ⬅️ room for taller bars */
      padding: 10px;
    }

    .churn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 48px;
    }

    .churn-bars {
      display: flex;
      gap: 1px;
      align-items: flex-end;
      height: 420px;
      /* ⬅️ taller bars */
    }


    .churn-bar {
      width: 30px;
      border-radius: 4px 4px 0 0;
      position: relative;
      /* REQUIRED for top label */
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }


    .bar-value {
      position: absolute;
      top: -18px;
      /* puts value above the bar */
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      color: #000;
      white-space: nowrap;
    }


    .zero-bar {
      width: 30px;
      height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #050505;
    }


    .onboarded {
      background: #4CAF50;
    }

    .offboarded {
      background: #E74C3C;
    }

    .churn-label {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <h2 id="title"></h2>

  <!-- FUNNEL FILTER -->
  <div class="control-row">
    <select id="yearSelect"></select>
    <select id="monthSelect"></select>
    <button id="refreshBtn">Refresh Data</button>
  </div>

  <div class="grid" id="grid"></div>

  <!-- CHURN -->
  <h2>Membership Onboarded vs. Offboarded Churn</h2>

  <div class="control-row">
    <select id="churnRange">
      <option value="weekly">Weekly</option>
      <option value="monthly" selected>Monthly</option>
      <option value="quarterly">Quarterly</option>
      <option value="half-year">Half-Year</option>
      <option value="yearly">Yearly</option>
    </select>
  </div>

  <div class="churn-legend">
    <div class="legend-item">
      <span class="legend-dot legend-onboarded"></span>
      <span>Onboarded Members</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot legend-offboarded"></span>
      <span>Offboarded Members</span>
    </div>
  </div>


  <div class="grid" id="churnGrid"></div>
  <script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
  <script src="https://unpkg.com/dayjs@1/plugin/isoWeek.js"></script>
  <script>
    dayjs.extend(window.dayjs_plugin_isoWeek);
  </script>

  <script>
    let jsonData = null;
    let churnData = null;

    const START_YEAR = 2025;
    const CURRENT_YEAR = new Date().getFullYear();

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    const shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    const COUNTRIES = [
      "United Kingdom + Other",
      "United Arab Emirates",
      "South Africa",
      "Jordan"
    ];

    fetchData();

    /* ================= FETCH ================= */

    async function fetchData() {
      const ts = Date.now();
      jsonData = await fetch(`/data?ts=${ts}`).then(r => r.json());
      churnData = await fetch(`/churn?ts=${ts}`).then(r => r.json());
      buildSelectors();
      renderDashboard();
      renderChurn();
    }

    /* ================= SELECTORS ================= */

    function buildSelectors() {
      if (yearSelect.options.length) return;

      for (let y = START_YEAR; y <= CURRENT_YEAR; y++) {
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
      }

      monthNames.forEach((m, i) => {
        monthSelect.innerHTML += `<option value="${String(i + 1).padStart(2, "0")}">${m}</option>`;
      });

      yearSelect.value = CURRENT_YEAR;
      monthSelect.value = String(new Date().getMonth() + 1).padStart(2, "0");

      yearSelect.onchange = renderDashboard;
      monthSelect.onchange = renderDashboard;
      churnRange.onchange = renderChurn;
    }

    /* ================= FUNNEL ================= */

    function renderDashboard() {
      grid.innerHTML = "";
      const key = `${yearSelect.value}-${monthSelect.value}`;
      title.textContent = `Membership Conversion Funnel — ${monthNames[monthSelect.value - 1]} ${yearSelect.value}`;
      COUNTRIES.forEach(c => renderFunnelBox(grid, key, c));
    }

    function renderFunnelBox(grid, key, country) {
      const data = jsonData?.[key]?.[country];

      const stages = [
        "Joined Waitlist",
        "Offer Interview",
        "Interview",
        "Offer Membership",
        "Paid",
        "Member"
      ];

      const rows = data
        ? stages.map(s => Object.values(data.stages).find(x => x.name === s))
        : stages.map(s => ({ name: s, count: 0, drop: 0 }));

      const widths = ["100%", "98%", "75%", "50%", "25%", "8%"];
      const shapes = [
        "inset(0 0 0 0)",
        "polygon(0% 0%,100% 0%,90% 100%,10% 100%)",
        "polygon(0% 0%,100% 0%,85% 100%,15% 100%)",
        "polygon(0% 0%,100% 0%,80% 100%,20% 100%)",
        "polygon(0% 0%,100% 0%,70% 100%,30% 100%)",
        "polygon(0% 0%,100% 0%,60% 100%,40% 100%)"
      ];

      const colors = ["#4169E1", "#3A7FF0", "#5A8DEE", "#7FB5F3", "#F4C24B", "#DB5A2E"];

      const box = document.createElement("div");
      box.className = "funnel-box";
      box.innerHTML = `<div class="country-title">${country}</div>`;

      rows.forEach((r, i) => {
        box.innerHTML += `
      <div class="row">
        <div class="stage">${r.name}</div>
        <div class="bar-wrapper">
          <div class="bar"
            style="--w:${widths[i]};
                   --c:${colors[i]};
                   --shape:${shapes[i]}">
            ${r.count}
          </div>
        </div>
        <div class="metrics">${i === 0 ? "" : `drop ${r.drop}`}</div>
      </div>`;
      });

      grid.appendChild(box);
    }

    /* ================= CHURN ================= */

    function getISOWeekStart(year, week) {
      const d = new Date(year, 0, 1 + (week - 1) * 7);
      d.setDate(d.getDate() - d.getDay() + 1);
      return d;
    }

    function aggregateChurn(rows, mode) {
      const map = {};

      rows.forEach(r => {
        const d = dayjs(r.label); // YYYY-MM-DD
        let key;

        if (mode === "weekly") {
          key = `${d.isoWeekYear()}-W${String(d.isoWeek()).padStart(2, "0")}`;
        }
        else if (mode === "monthly") {
          key = `${d.year()}-${String(d.month() + 1).padStart(2, "0")}`;
        }
        else if (mode === "quarterly") {
          key = `${d.year()}-Q${Math.ceil((d.month() + 1) / 3)}`;
        }
        else if (mode === "half-year") {
          key = `${d.year()}-H${d.month() < 6 ? 1 : 2}`;
        }
        else {
          key = `${d.year()}`;
        }

        map[key] ??= { label: key, onboarded: 0, offboarded: 0 };
        map[key].onboarded += r.onboarded;
        map[key].offboarded += r.offboarded;
      });

      return Object.values(map)
        .filter(r => r.onboarded > 0 || r.offboarded > 0) // 🔑 REQUIRED
        .sort((a, b) => a.label.localeCompare(b.label));
    }

    function formatChurnLabel(label, mode) {
      if (mode === "weekly") {
        const [y, w] = label.split("-W");
        const start = dayjs().year(Number(y)).isoWeek(Number(w)).startOf("isoWeek");
        const end = start.add(6, "day");

        return `${start.date()}–${end.date()}<br>${shortMonths[start.month()]}, ${y}`;
      }

      if (mode === "monthly") {
        const [y, m] = label.split("-");
        return `${shortMonths[m - 1]}<br>${y}`;
      }

      if (mode === "quarterly") {
        const [y, q] = label.split("-Q");
        return `(${shortMonths[(q - 1) * 3]}–${shortMonths[(q - 1) * 3 + 2]})<br>${y}`;
      }

      if (mode === "half-year") {
        const [y, h] = label.split("-H");
        return h === "1" ? `(Jan–Jun)<br>${y}` : `(Jul–Dec)<br>${y}`;
      }

      return label;
    }

    function renderChurn() {
      churnGrid.innerHTML = "";
      const mode = churnRange.value;

      COUNTRIES.forEach(country => {
        const raw = churnData?.[country] || [];
        if (!raw.length) return;

        const rows = aggregateChurn(raw, mode);
        const max = Math.max(...rows.map(r => Math.max(r.onboarded, r.offboarded)), 1);

        const box = document.createElement("div");
        box.className = "funnel-box";
        box.innerHTML = `<div class="country-title">${country}</div>`;

        const scroll = document.createElement("div");
        scroll.className = "churn-scroll";

        const chart = document.createElement("div");
        chart.className = "churn-chart";

        rows.forEach(r => {
          chart.innerHTML += `
  <div class="churn-group">
    <div class="churn-bars">
      <div class="churn-bars">

  <!-- ONBOARDED -->
  ${r.onboarded > 0
              ? `<div class="churn-bar onboarded"
     style="height:${(r.onboarded / max) * 100}%">
  <span class="bar-value">${r.onboarded}</span>
</div>`
              : `<div class="zero-bar">0</div>`}

  <!-- OFFBOARDED -->
  ${r.offboarded > 0
              ? `<div class="churn-bar offboarded"
     style="height:${(r.offboarded / max) * 100}%">
  <span class="bar-value">${r.offboarded}</span>
</div>`
              : `<div class="zero-bar">0</div>`}

</div>

    </div>
    <div class="churn-label">${formatChurnLabel(r.label, mode)}</div>
  </div>`;

        });

        scroll.appendChild(chart);
        box.appendChild(scroll);
        churnGrid.appendChild(box);
      });
    }

    /* ================= REFRESH ================= */

    refreshBtn.onclick = async () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing…";
      try {
        await fetch("/refresh", { method: "POST" });
        await fetchData();
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh Data";
      }
    };
  </script>

</body>

</html>
